<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式馬卡龍即時文字牆</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Matter.js 物理引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Google Fonts: 標準繁體思源黑體 (Noto Sans TC) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fcfaf7;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        /* 馬卡龍卡片柔和色系 */
        .macaron-pink { background-color: #ffb7b2; }
        .macaron-blue { background-color: #b5ead7; }
        .macaron-yellow { background-color: #ffdac1; }
        .macaron-purple { background-color: #e2f0cb; }
        .macaron-mint { background-color: #c7ceea; }

        /* 中央大容器微幅懸浮律動 */
        @keyframes containerFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .container-art {
            animation: containerFloat 4.5s ease-in-out infinite;
        }
        .container-shadow {
            filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.12));
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between relative overflow-hidden">

    <!-- 頂端標題與控制工具列 -->
    <header class="w-full px-6 py-4 flex justify-between items-center z-30 bg-white/85 backdrop-blur-md border-b border-gray-100 shadow-sm">
        <div>
            <h1 id="main-title" class="text-2xl md:text-3xl font-bold text-gray-800 tracking-wide flex items-center gap-2">
                <span id="title-icon">🗑️</span>
                <span id="title-text">丟掉煩惱、留下真心話</span>
            </h1>
            <p id="main-subtitle" class="text-xs md:text-sm text-gray-500 mt-1">請用手機掃描 QR Code 把想法投遞進來！</p>
        </div>
        
        <div class="flex items-center gap-3">
            <!-- 模組切換選單 -->
            <div class="relative">
                <select id="module-select" class="px-4 py-2 bg-white border-2 border-pink-200 text-gray-700 font-bold text-sm md:text-base rounded-full shadow-sm focus:outline-none cursor-pointer pr-8 appearance-none">
                    <option value="trash">🗑️ 垃圾桶 (紙球)</option>
                    <option value="well">⛲ 許願池 (金幣)</option>
                    <option value="vote">🗳️ 投票箱 (選票)</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-gray-500 text-xs">
                    ▼
                </div>
            </div>

            <!-- QR Code 彈窗按鈕 -->
            <button id="qr-btn" class="px-4 py-2 bg-pink-400 hover:bg-pink-500 text-white font-bold text-sm md:text-base rounded-full shadow-md transition transform active:scale-95 cursor-pointer flex items-center gap-1.5">
                <span>📱</span> QR Code
            </button>

            <!-- 收集清單彈窗按鈕 -->
            <button id="list-btn" class="px-4 py-2 bg-amber-300 hover:bg-amber-400 text-gray-800 font-bold text-sm md:text-base rounded-full shadow-md transition transform active:scale-95 cursor-pointer flex items-center gap-1.5">
                <span id="list-icon">🗑️</span> 清單 (<span id="count">0</span>)
            </button>
        </div>
    </header>

    <!-- 中央大容器向量視覺區（佔畫面高度約 50%，上方留出掉落物理軌道） -->
    <div id="container-visual-wrapper" class="absolute left-1/2 bottom-2 transform -translate-x-1/2 z-10 pointer-events-none flex flex-col items-center">
        <div id="container-svg-host" class="container-art container-shadow flex justify-center items-end" style="height: 50vh; max-height: 500px; width: min(88vw, 680px);">
            <!-- JS 動態生成大垃圾桶 / 大許願池 / 大投票箱向量插圖 -->
        </div>
        <div class="mt-2 bg-white/95 backdrop-blur-sm px-6 py-1.5 rounded-full shadow-sm border border-gray-200 text-gray-600 font-bold text-xs md:text-sm flex items-center gap-2">
            <span id="tag-icon">🗑️</span>
            <span id="tag-label">真心話垃圾桶 (投入紙球累積中)</span>
        </div>
    </div>

    <!-- Matter.js 物理圖層 (全螢幕覆蓋，物件從頂部拋落入大容器中) -->
    <div id="canvas-container" class="absolute inset-0 z-20 pointer-events-none"></div>

    <!-- 手機端輸入介面 (僅在網址帶有 ?mobile=1 時全螢幕覆蓋顯示) -->
    <div id="mobile-view" class="hidden fixed inset-0 bg-[#fff8f5] z-50 flex flex-col justify-center items-center p-5 overflow-y-auto">
        <div class="max-w-md w-full bg-white p-7 rounded-3xl shadow-2xl border-4 border-pink-200 text-center relative">
            <div id="mobile-icon" class="text-5xl mb-3">📜</div>
            <h2 id="mobile-heading" class="text-2xl font-bold text-gray-800 mb-1">寫下你的真心話</h2>
            <p id="mobile-desc" class="text-gray-500 mb-4 text-sm">送出後，它會揉成紙球直接拋進大螢幕！</p>
            <textarea id="user-input" rows="4" class="w-full p-4 border-2 border-pink-200 rounded-2xl text-base focus:outline-none focus:border-pink-400 resize-none mb-4" placeholder="請在此輸入想說的話..."></textarea>
            <button id="submit-btn" class="w-full py-3.5 bg-pink-400 hover:bg-pink-500 active:bg-pink-600 text-white font-bold text-lg rounded-2xl shadow-lg transition transform active:scale-95 cursor-pointer">
                🚀 揉成紙球丟出去！
            </button>
            <div id="success-msg" class="hidden mt-3 text-emerald-700 font-bold text-sm p-3 bg-emerald-50 rounded-xl border border-emerald-200">
                🎉 投遞成功！請看大螢幕～
            </div>
            <div id="error-msg" class="hidden mt-3 text-red-600 font-bold text-xs p-2 bg-red-50 rounded-xl border border-red-200"></div>
        </div>
    </div>

    <!-- QR Code 彈窗 -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-black/45 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white p-6 rounded-3xl shadow-2xl text-center max-w-sm w-full relative">
            <h3 class="text-lg font-bold text-gray-800 mb-1">手機掃描立即投遞</h3>
            <p class="text-xs text-gray-500 mb-3">掃描後即可直接在手機上輸入並拋入現場大螢幕！</p>
            <div id="qrcode" class="flex justify-center my-3 p-3 bg-gray-50 rounded-2xl border border-gray-100"></div>
            <p class="text-gray-400 text-xs mb-4 break-all font-mono" id="share-url"></p>
            <button id="close-qr" class="w-full py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-sm rounded-xl cursor-pointer">
                關閉視窗
            </button>
        </div>
    </div>

    <!-- 清單與 Google Drive 雲端備份彈窗 -->
    <div id="list-modal" class="hidden fixed inset-0 bg-black/45 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div id="modal-content-box" class="bg-white p-6 rounded-3xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col relative">
            <div class="flex justify-between items-center mb-3 border-b pb-3">
                <h3 id="modal-title" class="text-xl font-bold text-gray-800">🗑️ 收集清單內容</h3>
                <button id="close-list" class="text-gray-400 hover:text-gray-600 text-2xl font-bold cursor-pointer leading-none">&times;</button>
            </div>
            <div id="items-list" class="overflow-y-auto flex-1 space-y-2.5 pr-2 mb-3">
                <!-- 動態載入項目 -->
            </div>
            <!-- 雲端備份控制區 -->
            <div class="border-t pt-3 flex flex-col gap-2">
                <div class="flex items-center gap-2">
                    <input type="text" id="gas-url" value="https://script.google.com/macros/s/AKfycbwKCtrPyuJE3stRZl3Iby5oFx1E8p8X_pNze8JZe_lq17xHdAHql-okINzVpMnEDCiz/exec" placeholder="Google Apps Script 部署網址 (Web App URL)" class="flex-1 p-2 border rounded-xl text-xs text-gray-600 focus:outline-none focus:border-pink-400 font-mono">
                </div>
                <div class="flex justify-between items-center">
                    <span id="backup-status" class="text-xs text-gray-500 font-medium"></span>
                    <button id="backup-btn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow cursor-pointer transition text-xs flex items-center gap-1">
                        ☁️ 備份清單至 Google Drive
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase 專案配置 (已填入您的專案金鑰)
        const firebaseConfig = {
            apiKey: "AIzaSyB-1enGLCK0WdU3g8mPe6PSlEeH4C3fHfs",
            authDomain: "textwall-fc112.firebaseapp.com",
            projectId: "textwall-fc112",
            storageBucket: "textwall-fc112.firebasestorage.app",
            messagingSenderId: "718086100693",
            appId: "1:718086100693:web:7f859c361faa776409745c"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const appId = 'macaron-interactive-wall';

        let allMessages = [];
        let currentModule = 'trash';

        const moduleConfigs = {
            trash: {
                title: "丟掉煩惱、留下真心話",
                subtitle: "請用手機掃描 QR Code 把想法丟進垃圾桶！",
                btnText: "🗑️ 垃圾桶清單",
                icon: "🗑️",
                tagLabel: "真心話垃圾桶 (投入紙球中)",
                mobileIcon: "📜",
                mobileHeading: "寫下你的真心話",
                mobileDesc: "送出後，它會揉成紙球直接拋進大垃圾桶！",
                submitText: "🚀 揉成紙球丟出去！",
                colorList: ['#ffb7b2', '#b5ead7', '#ffdac1', '#e2f0cb', '#c7ceea'],
                // 大垃圾桶 SVG (約 50% 視窗高度，開口向上寬敞)
                renderSvg: () => `
                    <svg viewBox="0 0 500 400" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="250" cy="375" rx="170" ry="18" fill="rgba(0,0,0,0.08)"/>
                        <defs>
                            <linearGradient id="trashBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#a8b2c1"/>
                                <stop offset="25%" stop-color="#d6dce5"/>
                                <stop offset="70%" stop-color="#bcc7d6"/>
                                <stop offset="100%" stop-color="#939fb2"/>
                            </linearGradient>
                            <linearGradient id="trashRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#cbd5e1"/>
                                <stop offset="100%" stop-color="#94a3b8"/>
                            </linearGradient>
                        </defs>
                        <path d="M 85 85 L 125 365 Q 130 380 160 380 L 340 380 Q 370 380 375 365 L 415 85 Z" fill="url(#trashBodyGrad)" stroke="#64748b" stroke-width="6"/>
                        <line x1="180" y1="110" x2="195" y2="360" stroke="#7e8d9f" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
                        <line x1="250" y1="110" x2="250" y2="365" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
                        <line x1="320" y1="110" x2="305" y2="360" stroke="#7e8d9f" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
                        <ellipse cx="250" cy="85" rx="165" ry="32" fill="#2d3748" stroke="url(#trashRimGrad)" stroke-width="12"/>
                        <ellipse cx="250" cy="87" rx="145" ry="22" fill="#1a202c"/>
                    </svg>
                `
            },
            well: {
                title: "許願池：投下心中的夢想",
                subtitle: "掃描 QR Code 投入金幣，讓願望在許願池閃耀！",
                btnText: "⛲ 許願金幣簿",
                icon: "⛲",
                tagLabel: "石造許願池 (金幣累積中)",
                mobileIcon: "🪙",
                mobileHeading: "寫下你的心願",
                mobileDesc: "送出後，金幣會閃耀著落入大螢幕許願池！",
                submitText: "✨ 投入許願金幣！",
                colorList: ['#ffd700', '#ffca28', '#ffe082', '#ffc107', '#ffb300'],
                // 大許願池 SVG (約 50% 視窗高度，石造古典水池)
                renderSvg: () => `
                    <svg viewBox="0 0 540 400" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="270" cy="375" rx="230" ry="20" fill="rgba(0,0,0,0.1)"/>
                        <defs>
                            <linearGradient id="stoneWallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#b8a99a"/>
                                <stop offset="30%" stop-color="#e2d8cd"/>
                                <stop offset="70%" stop-color="#d4c7b8"/>
                                <stop offset="100%" stop-color="#9e8f81"/>
                            </linearGradient>
                            <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#38bdf8"/>
                                <stop offset="60%" stop-color="#0284c7"/>
                                <stop offset="100%" stop-color="#0369a1"/>
                            </linearGradient>
                        </defs>
                        <path d="M 40 100 L 70 350 Q 80 375 140 375 L 400 375 Q 460 375 470 350 L 500 100 Z" fill="url(#stoneWallGrad)" stroke="#786a5a" stroke-width="7"/>
                        <path d="M 120 180 Q 200 200 320 180" stroke="#786a5a" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>
                        <path d="M 90 270 Q 270 295 440 270" stroke="#786a5a" stroke-width="4" stroke-dasharray="8 6" opacity="0.6"/>
                        <ellipse cx="270" cy="100" rx="230" ry="40" fill="#9e8f81" stroke="#685a4a" stroke-width="10"/>
                        <ellipse cx="270" cy="100" rx="205" ry="30" fill="url(#waterGrad)"/>
                        <ellipse cx="250" cy="95" rx="140" ry="14" fill="#7dd3fc" opacity="0.45"/>
                    </svg>
                `
            },
            vote: {
                title: "即時投票箱：投下神聖的一票",
                subtitle: "掃描 QR Code 傳送選票，即時統計您的選項！",
                btnText: "🗳️ 選票清單",
                icon: "🗳️",
                tagLabel: "民主投票箱 (選票投入中)",
                mobileIcon: "📝",
                mobileHeading: "輸入您的票選意見",
                mobileDesc: "送出後，摺疊選票會投入大螢幕投票箱！",
                submitText: "📥 投入投票箱！",
                colorList: ['#99f6e4', '#5eead4', '#2dd4bf', '#14b8a6', '#0d9488'],
                // 大投票箱 SVG (約 50% 視窗高度，投票口居中開闊)
                renderSvg: () => `
                    <svg viewBox="0 0 500 400" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="250" cy="380" rx="190" ry="18" fill="rgba(0,0,0,0.12)"/>
                        <defs>
                            <linearGradient id="boxFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#ffffff"/>
                                <stop offset="100%" stop-color="#e2e8f0"/>
                            </linearGradient>
                            <linearGradient id="boxTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#0f766e"/>
                                <stop offset="50%" stop-color="#14b8a6"/>
                                <stop offset="100%" stop-color="#0d9488"/>
                            </linearGradient>
                        </defs>
                        <path d="M 60 110 L 80 365 Q 85 380 120 380 L 380 380 Q 415 380 420 365 L 440 110 Z" fill="url(#boxFrontGrad)" stroke="#0f766e" stroke-width="7"/>
                        <rect x="180" y="200" width="140" height="90" rx="16" fill="#f0fdfa" stroke="#0d9488" stroke-width="4"/>
                        <text x="250" y="240" font-size="28" text-anchor="middle" fill="#0f766e" font-weight="bold">🗳️ 投票箱</text>
                        <text x="250" y="270" font-size="14" text-anchor="middle" fill="#115e59">BALLOT BOX</text>
                        <polygon points="30,110 90,60 410,60 470,110" fill="url(#boxTopGrad)" stroke="#0f766e" stroke-width="6"/>
                        <ellipse cx="250" cy="85" rx="110" ry="12" fill="#042f2e" stroke="#ccfbf1" stroke-width="3"/>
                    </svg>
                `
            }
        };

        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite;

        const engine = Engine.create();
        const world = engine.world;
        engine.world.gravity.y = 1.05;

        const canvasHost = document.getElementById('canvas-container');
        const render = Render.create({
            element: canvasHost,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: 'transparent'
            }
        });
        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        let containerFloor, containerLeftWall, containerRightWall;

        function updatePhysicsWalls() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            if (containerFloor) Composite.remove(world, containerFloor);
            if (containerLeftWall) Composite.remove(world, containerLeftWall);
            if (containerRightWall) Composite.remove(world, containerRightWall);

            const containerHeight = Math.min(h * 0.50, 500);
            const containerWidth = Math.min(w * 0.88, 680);
            const centerX = w / 2;
            const bottomY = h - 20;

            containerFloor = Bodies.rectangle(centerX, bottomY, containerWidth * 0.72, 40, {
                isStatic: true,
                render: { visible: false }
            });

            const wallH = containerHeight * 0.82;
            const wallY = bottomY - wallH / 2;
            containerLeftWall = Bodies.rectangle(centerX - (containerWidth * 0.72) / 2, wallY, 30, wallH, {
                isStatic: true,
                render: { visible: false }
            });
            containerRightWall = Bodies.rectangle(centerX + (containerWidth * 0.72) / 2, wallY, 30, wallH, {
                isStatic: true,
                render: { visible: false }
            });

            Composite.add(world, [containerFloor, containerLeftWall, containerRightWall]);
        }

        updatePhysicsWalls();

        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
            updatePhysicsWalls();
        });

        function updateModuleUI(mod) {
            currentModule = mod;
            const cfg = moduleConfigs[mod];

            // 標題列與標籤更新
            document.getElementById('title-icon').innerText = cfg.icon;
            document.getElementById('title-text').innerText = cfg.title;
            document.getElementById('main-subtitle').innerText = cfg.subtitle;
            document.getElementById('list-icon').innerText = cfg.icon;
            document.getElementById('tag-icon').innerText = cfg.icon;
            document.getElementById('tag-label').innerText = cfg.tagLabel;

            // 即時替換中央大容器圖示
            document.getElementById('container-svg-host').innerHTML = cfg.renderSvg();

            // 手機端表單提示更新
            document.getElementById('mobile-icon').innerText = cfg.mobileIcon;
            document.getElementById('mobile-heading').innerText = cfg.mobileHeading;
            document.getElementById('mobile-desc').innerText = cfg.mobileDesc;
            document.getElementById('submit-btn').innerText = cfg.submitText;

            updateListContent();
        }

        // 初始化預設為垃圾桶模組
        updateModuleUI('trash');

        // 監聽模組切換選單
        document.getElementById('module-select').addEventListener('change', (e) => {
            updateModuleUI(e.target.value);
        });

        function spawnObject(moduleType) {
            const centerX = window.innerWidth / 2;
            const spawnSpread = Math.min(window.innerWidth * 0.35, 240);
            const startX = centerX + (Math.random() * spawnSpread - spawnSpread / 2);
            const startY = -40;

            const cfg = moduleConfigs[moduleType] || moduleConfigs.trash;
            const color = cfg.colorList[Math.floor(Math.random() * cfg.colorList.length)];
            let body;

            if (moduleType === 'well') {
                body = Bodies.circle(startX, startY, 26, {
                    restitution: 0.65,
                    friction: 0.08,
                    density: 0.002,
                    render: { fillStyle: color, strokeStyle: '#ffffff', lineWidth: 3 }
                });
            } else if (moduleType === 'vote') {
                body = Bodies.rectangle(startX, startY, 64, 40, {
                    restitution: 0.25,
                    friction: 0.3,
                    density: 0.0015,
                    angle: (Math.random() - 0.5) * 1.5,
                    render: { fillStyle: color, strokeStyle: '#ffffff', lineWidth: 2 }
                });
            } else {
                body = Bodies.circle(startX, startY, 30, {
                    restitution: 0.45,
                    friction: 0.2,
                    density: 0.0018,
                    render: { fillStyle: color, strokeStyle: '#ffffff', lineWidth: 3 }
                });
            }

            Composite.add(world, body);
        }

        function initFirestoreListener() {
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'messages'));
            onSnapshot(q, (snapshot) => {
                let newMessages = [];
                snapshot.forEach((doc) => {
                    newMessages.push({ id: doc.id, ...doc.data() });
                });
                newMessages.sort((a, b) => b.timestamp - a.timestamp);

                // 若有新訊息進來，立即產生對應物體拋落
                if (newMessages.length > allMessages.length && allMessages.length > 0) {
                    const diff = newMessages.length - allMessages.length;
                    for (let i = 0; i < Math.min(diff, 5); i++) {
                        const latest = newMessages[i];
                        setTimeout(() => {
                            spawnObject(latest.module || currentModule);
                        }, i * 200);
                    }
                }

                allMessages = newMessages;
                const filtered = allMessages.filter(m => (m.module || 'trash') === currentModule);
                document.getElementById('count').innerText = filtered.length;
                updateListContent();
            }, (error) => {
                console.error("Firestore 連線失敗:", error);
            });
        }

        // 直接啟動 Firestore 監聽 (不依賴匿名登入，消除權限卡關)
        initFirestoreListener();

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mobile') === '1') {
            // 僅在網址帶有 ?mobile=1 時顯示手機投稿頁面
            document.getElementById('mobile-view').classList.remove('hidden');
        }

        document.getElementById('submit-btn').addEventListener('click', async () => {
            const inputEl = document.getElementById('user-input');
            const text = inputEl.value.trim();
            const successMsg = document.getElementById('success-msg');
            const errorMsg = document.getElementById('error-msg');

            successMsg.classList.add('hidden');
            errorMsg.classList.add('hidden');

            if (!text) {
                errorMsg.innerText = "請輸入文字後再送出喔！";
                errorMsg.classList.remove('hidden');
                return;
            }

            const btn = document.getElementById('submit-btn');
            try {
                btn.disabled = true;
                btn.innerText = "🚀 投遞中...";

                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
                    text: text,
                    module: currentModule,
                    timestamp: Date.now()
                });

                // 本機立即掉落一顆提升回饋感
                spawnObject(currentModule);

                inputEl.value = '';
                successMsg.classList.remove('hidden');
                setTimeout(() => {
                    successMsg.classList.add('hidden');
                }, 3500);
            } catch (err) {
                console.error("送出失敗:", err);
                errorMsg.innerText = "傳送失敗，請確認 Firebase Rules 是否已設為 allow read, write: if true;";
                errorMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = moduleConfigs[currentModule].submitText;
            }
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function updateListContent() {
            const cfg = moduleConfigs[currentModule];
            document.getElementById('modal-title').innerText = `${cfg.icon} ${cfg.btnText}內容`;
            const listEl = document.getElementById('items-list');
            listEl.innerHTML = '';

            const filtered = allMessages.filter(m => (m.module || 'trash') === currentModule);
            if (filtered.length === 0) {
                listEl.innerHTML = `<p class="text-center text-gray-400 py-8 text-sm">目前容器中還沒有任何紀錄喔！</p>`;
                return;
            }

            filtered.forEach((msg, index) => {
                const dateStr = new Date(msg.timestamp).toLocaleTimeString('zh-TW', { hour12: false });
                const colorClass = ['macaron-pink', 'macaron-blue', 'macaron-yellow', 'macaron-purple', 'macaron-mint'][index % 5];
                const item = document.createElement('div');
                item.className = `p-3 rounded-2xl ${colorClass} text-gray-800 shadow-sm flex justify-between items-center border border-white/60`;
                item.innerHTML = `
                    <div class="text-sm font-medium break-all pr-3">${escapeHtml(msg.text)}</div>
                    <div class="text-xs text-gray-600 whitespace-nowrap font-mono">${dateStr}</div>
                `;
                listEl.appendChild(item);
            });
        }

        const currentUrl = window.location.href.split('?')[0] + '?mobile=1';
        document.getElementById('share-url').innerText = currentUrl;
        new QRCode(document.getElementById("qrcode"), {
            text: currentUrl,
            width: 180,
            height: 180
        });

        document.getElementById('qr-btn').addEventListener('click', () => {
            document.getElementById('qr-modal').classList.remove('hidden');
        });
        document.getElementById('close-qr').addEventListener('click', () => {
            document.getElementById('qr-modal').classList.add('hidden');
        });

        document.getElementById('list-btn').addEventListener('click', () => {
            document.getElementById('list-modal').classList.remove('hidden');
        });
        document.getElementById('close-list').addEventListener('click', () => {
            document.getElementById('list-modal').classList.add('hidden');
        });

        document.getElementById('backup-btn').addEventListener('click', async () => {
            const gasUrl = document.getElementById('gas-url').value.trim();
            const statusEl = document.getElementById('backup-status');

            if (!gasUrl) {
                statusEl.innerText = "⚠️ 請填入 GAS 部署網址";
                return;
            }

            statusEl.innerText = "⏳ 正在備份至 Google Drive...";
            const filtered = allMessages.filter(m => (m.module || 'trash') === currentModule);

            try {
                await fetch(gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        module: currentModule,
                        messages: filtered
                    })
                });
                statusEl.innerText = "✅ 備份請求已送出！請至 Google Drive 資料夾確認。";
            } catch (err) {
                console.error(err);
                statusEl.innerText = "❌ 備份失敗，請檢查 GAS 部署權限。";
            }
        });
    </script>
</body>
</html>
