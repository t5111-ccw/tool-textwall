<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式馬卡龍即時文字牆</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Matter.js 物理引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Varela Round', 'ZCOOL KuaiLe', sans-serif; background-color: #fdfbf7; overflow: hidden; }
        .macaron-pink { background-color: #ffb7b2; }
        .macaron-blue { background-color: #b5ead7; }
        .macaron-yellow { background-color: #ffdac1; }
        .macaron-purple { background-color: #e2f0cb; }
        .macaron-mint { background-color: #c7ceea; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between select-none relative">

    <header class="w-full p-6 flex justify-between items-center z-20 bg-white/85 backdrop-blur-md shadow-sm">
        <div>
            <h1 id="main-title" class="text-3xl md:text-5xl font-bold text-gray-700 tracking-wide">✨ 丟掉煩惱、留下真心話 ✨</h1>
            <p id="main-subtitle" class="text-lg md:text-xl text-gray-500 mt-1">請用手機掃描 QR Code 把想法丟進垃圾桶！</p>
        </div>
        <div class="flex items-center gap-4">
            <!-- 互動模組切換選單 -->
            <select id="module-select" class="px-4 py-3 bg-white border-2 border-pink-200 text-gray-700 font-bold text-lg rounded-full shadow-md focus:outline-none cursor-pointer">
                <option value="trash">🗑️ 垃圾桶 (紙球)</option>
                <option value="well">⛲ 許願池 (金幣)</option>
                <option value="vote">🗳️ 投票箱 (選票)</option>
            </select>
            <button id="qr-btn" class="px-6 py-3 bg-pink-400 hover:bg-pink-500 text-white font-bold text-xl rounded-full shadow-lg transition transform hover:scale-105 cursor-pointer">
                📱 QR Code
            </button>
            <button id="list-btn" class="px-6 py-3 bg-amber-300 hover:bg-amber-400 text-gray-700 font-bold text-xl rounded-full shadow-lg transition transform hover:scale-105 cursor-pointer flex items-center gap-2">
                <span id="list-icon">🗑️</span> 清單 (<span id="count">0</span>)
            </button>
        </div>
    </header>

    <div id="canvas-container" class="absolute inset-0 z-10 pointer-events-none"></div>

    <!-- 底部視覺容器提示 -->
    <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-10 text-center pointer-events-none flex flex-col items-center">
        <div id="container-icon" class="text-6xl animate-bounce">🗑️</div>
        <span id="container-text" class="text-xl font-bold text-gray-400 mt-2 bg-white/80 px-4 py-1 rounded-full shadow">垃圾桶 (點擊右上角檢視清單)</span>
    </div>

    <!-- 手機端輸入介面 -->
    <div id="mobile-view" class="hidden absolute inset-0 bg-[#fff5f5] z-50 flex flex-col justify-center items-center p-6">
        <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-2xl border-4 border-pink-200 text-center">
            <div id="mobile-icon" class="text-5xl mb-4">📜</div>
            <h2 id="mobile-heading" class="text-3xl font-bold text-gray-700 mb-2">寫下你的心聲</h2>
            <p id="mobile-desc" class="text-gray-500 mb-6 text-lg">送出後，它會變成物件飛進大螢幕！</p>
            <textarea id="user-input" rows="4" class="w-full p-4 border-2 border-pink-200 rounded-2xl text-xl focus:outline-none focus:border-pink-400 resize-none mb-6" placeholder="請在此輸入想說的話..."></textarea>
            <button id="submit-btn" class="w-full py-4 bg-pink-400 hover:bg-pink-500 text-white font-bold text-2xl rounded-2xl shadow-lg transition transform active:scale-95 cursor-pointer">
                🚀 投遞出去！
            </button>
            <div id="success-msg" class="hidden mt-4 text-green-500 font-bold text-xl animate-pulse">
                🎉 投遞成功！請看大螢幕～
            </div>
        </div>
    </div>

    <!-- QR Code 彈窗 -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl text-center max-w-sm w-full relative">
            <h3 class="text-2xl font-bold text-gray-700 mb-4">掃描 QR Code 參與互動</h3>
            <div id="qrcode" class="flex justify-center my-4 p-4 bg-gray-50 rounded-2xl border"></div>
            <p class="text-gray-500 text-sm mb-6 break-all" id="share-url"></p>
            <button id="close-qr" class="w-full py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-lg rounded-xl cursor-pointer">
                關閉
            </button>
        </div>
    </div>

    <!-- 清單與雲端備份彈窗 -->
    <div id="list-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col relative">
            <div class="flex justify-between items-center mb-4 border-b pb-4">
                <h3 id="modal-title" class="text-3xl font-bold text-gray-700">🗑️ 清單內容</h3>
                <button id="close-list" class="text-gray-400 hover:text-gray-600 text-3xl font-bold cursor-pointer">&times;</button>
            </div>
            <div id="items-list" class="overflow-y-auto flex-1 space-y-3 pr-2 mb-4">
                <!-- 動態清單 -->
            </div>
            <div class="border-t pt-4 flex flex-col gap-3">
                <input type="text" id="gas-url" value="https://script.google.com/macros/s/AKfycbwKCtrPyuJE3stRZl3Iby5oFx1E8p8X_pNze8JZe_lq17xHdAHql-okINzVpMnEDCiz/exec" placeholder="請輸入 Google Apps Script 部署網址 (Web App URL)" class="w-full p-3 border rounded-xl text-sm focus:outline-none focus:border-pink-400">
                <div class="flex justify-between items-center">
                    <span id="backup-status" class="text-sm text-gray-500"></span>
                    <button id="backup-btn" class="px-6 py-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl shadow cursor-pointer transition">
                        ☁️ 備份清單至 Google Drive
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK 與互動邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 已代入您的專案金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyB-1enGLCK0WdU3g8mPe6PSlEeH4C3fHfs",
            authDomain: "textwall-fc112.firebaseapp.com",
            projectId: "textwall-fc112",
            storageBucket: "textwall-fc112.firebasestorage.app",
            messagingSenderId: "718086100693",
            appId: "1:718086100693:web:7f859c361faa776409745c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'macaron-textwall-prod';

        let currentUser = null;
        let allMessages = [];
        let currentModule = 'trash';

        const moduleConfigs = {
            trash: {
                title: "✨ 丟掉煩惱、留下真心話 ✨",
                subtitle: "請用手機掃描 QR Code 把想法丟進垃圾桶！",
                btnText: "🗑️ 垃圾桶清單",
                icon: "🗑️",
                mobileIcon: "📜",
                mobileHeading: "寫下你的心聲",
                mobileDesc: "送出後，它會變成紙球飛進大螢幕！",
                submitText: "🚀 揉成紙球丟出去！",
                colorList: ['#ffb7b2', '#b5ead7', '#ffdac1', '#e2f0cb', '#c7ceea']
            },
            well: {
                title: "🪙 許願池：投下心中的夢想 🪙",
                subtitle: "掃描 QR Code 投入金幣，讓願望在許願池閃耀！",
                btnText: "⛲ 許願金幣簿",
                icon: "⛲",
                mobileIcon: "🪙",
                mobileHeading: "寫下您的心願",
                mobileDesc: "送出後，金幣會閃耀著落入大螢幕許願池！",
                submitText: "✨ 投入許願池！",
                colorList: ['#ffd700', '#ffecb3', '#ffe082', '#ffca28']
            },
            vote: {
                title: "🗳️ 即時投票箱：投下神聖的一票 🗳️",
                subtitle: "掃描 QR Code 傳送選票，即時統計您的選項！",
                btnText: "🗳️ 選票清單",
                icon: "🗳️",
                mobileIcon: "📝",
                mobileHeading: "輸入您的選項/意見",
                mobileDesc: "送出後，摺疊選票會投入大螢幕投票箱！",
                submitText: "📥 投入投票箱！",
                colorList: ['#b2dfdb', '#80cbc4', '#4db6ac', '#a7ffeb']
            }
        };

        function updateModuleUI(mod) {
            currentModule = mod;
            const cfg = moduleConfigs[mod];
            document.getElementById('main-title').innerText = cfg.title;
            document.getElementById('main-subtitle').innerText = cfg.subtitle;
            document.getElementById('list-icon').innerText = cfg.icon;
            document.getElementById('container-icon').innerText = cfg.icon;
            document.getElementById('container-text').innerText = `${cfg.btnText.split(' ')[1]} (點擊右上角檢視清單)`;
            
            document.getElementById('mobile-icon').innerText = cfg.mobileIcon;
            document.getElementById('mobile-heading').innerText = cfg.mobileHeading;
            document.getElementById('mobile-desc').innerText = cfg.mobileDesc;
            document.getElementById('submit-btn').innerText = cfg.submitText;
            
            updateListContent();
        }

        document.getElementById('module-select').addEventListener('change', (e) => {
            updateModuleUI(e.target.value);
        });

        signInAnonymously(auth).catch((error) => console.error("Auth Error:", error));
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) initFirestoreListener();
        });

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mobile') === '1') {
            document.getElementById('mobile-view').classList.remove('hidden');
        }

        document.getElementById('submit-btn').addEventListener('click', async () => {
            const text = document.getElementById('user-input').value.trim();
            if (!text) {
                alert('請輸入一些文字再送出喔！');
                return;
            }
            if (!currentUser) return;

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
                    text: text,
                    module: currentModule,
                    timestamp: Date.now()
                });
                document.getElementById('user-input').value = '';
                document.getElementById('success-msg').classList.remove('hidden');
                setTimeout(() => document.getElementById('success-msg').classList.add('hidden'), 3000);
            } catch (e) {
                console.error("Error adding document: ", e);
            }
        });

        // Matter.js 物理引擎
        let Engine = Matter.Engine,
            Render = Matter.Render,
            Runner = Matter.Runner,
            Bodies = Matter.Bodies,
            Composite = Matter.Composite,
            Body = Matter.Body;

        let engine = Engine.create();
        let world = engine.world;
        engine.world.gravity.y = 1;

        let container = document.getElementById('canvas-container');
        let render = Render.create({
            element: container,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: 'transparent'
            }
        });
        Render.run(render);
        let runner = Runner.create();
        Runner.run(runner, engine);

        let wallOptions = { isStatic: true, render: { visible: false } };
        let ground = Bodies.rectangle(window.innerWidth / 2, window.innerHeight + 50, window.innerWidth, 100, wallOptions);
        let leftWall = Bodies.rectangle(-50, window.innerHeight / 2, 100, window.innerHeight, wallOptions);
        let rightWall = Bodies.rectangle(window.innerWidth + 50, window.innerHeight / 2, 100, window.innerHeight, wallOptions);
        let leftFunnel = Bodies.rectangle(window.innerWidth / 2 - 150, window.innerHeight - 100, 200, 20, wallOptions);
        Body.setAngle(leftFunnel, 0.3);
        let rightFunnel = Bodies.rectangle(window.innerWidth / 2 + 150, window.innerHeight - 100, 200, 20, wallOptions);
        Body.setAngle(rightFunnel, -0.3);

        Composite.add(world, [ground, leftWall, rightWall, leftFunnel, rightFunnel]);

        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
            Body.setPosition(ground, { x: window.innerWidth / 2, y: window.innerHeight + 50 });
            Body.setPosition(rightWall, { x: window.innerWidth + 50, y: window.innerHeight / 2 });
            Body.setPosition(leftFunnel, { x: window.innerWidth / 2 - 150, y: window.innerHeight - 100 });
            Body.setPosition(rightFunnel, { x: window.innerWidth / 2 + 150, y: window.innerHeight - 100 });
        });

        function spawnObject(moduleType) {
            let startX = Math.random() * (window.innerWidth - 200) + 100;
            let cfg = moduleConfigs[moduleType];
            let color = cfg.colorList[Math.floor(Math.random() * cfg.colorList.length)];
            let body;

            if (moduleType === 'vote') {
                body = Bodies.rectangle(startX, -50, 60, 40, {
                    restitution: 0.4,
                    friction: 0.2,
                    angle: Math.random() * Math.PI,
                    render: { fillStyle: color, strokeStyle: '#ffffff', lineWidth: 2 }
                });
            } else if (moduleType === 'well') {
                body = Bodies.circle(startX, -50, 25, {
                    restitution: 0.8,
                    friction: 0.05,
                    render: { fillStyle: color, strokeStyle: '#ffa000', lineWidth: 3 }
                });
            } else {
                body = Bodies.circle(startX, -50, 30, {
                    restitution: 0.6,
                    friction: 0.1,
                    render: { fillStyle: color, strokeStyle: '#ffffff', lineWidth: 3 }
                });
            }
            Composite.add(world, body);
        }

        function initFirestoreListener() {
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'messages'));
            onSnapshot(q, (snapshot) => {
                let newMessages = [];
                snapshot.forEach((doc) => {
                    newMessages.push({ id: doc.id, ...doc.data() });
                });
                newMessages.sort((a, b) => b.timestamp - a.timestamp);

                if (newMessages.length > allMessages.length && allMessages.length > 0) {
                    let latest = newMessages[0];
                    spawnObject(latest.module || 'trash');
                }

                allMessages = newMessages;
                let currentFiltered = allMessages.filter(m => (m.module || 'trash') === currentModule);
                document.getElementById('count').innerText = currentFiltered.length;
                updateListContent();
            }, (error) => {
                console.error("Firestore Error:", error);
            });
        }

        function updateListContent() {
            const cfg = moduleConfigs[currentModule];
            document.getElementById('modal-title').innerText = `${cfg.icon} ${cfg.btnText}內容`;
            const listEl = document.getElementById('items-list');
            listEl.innerHTML = '';

            let filtered = allMessages.filter(m => (m.module || 'trash') === currentModule);
            if (filtered.length === 0) {
                listEl.innerHTML = `<p class="text-center text-gray-400 py-8 text-xl">目前還沒有任何紀錄喔！</p>`;
                return;
            }

            filtered.forEach((msg, index) => {
                let dateStr = new Date(msg.timestamp).toLocaleTimeString();
                let colorClass = ['macaron-pink', 'macaron-blue', 'macaron-yellow', 'macaron-purple', 'macaron-mint'][index % 5];
                let item = document.createElement('div');
                item.className = `p-4 rounded-2xl ${colorClass} text-gray-700 shadow-md flex justify-between items-center`;
                item.innerHTML = `
                    <div class="text-xl font-medium break-all pr-4">📝 ${escapeHtml(msg.text)}</div>
                    <div class="text-xs text-gray-500 whitespace-nowrap">${dateStr}</div>
                `;
                listEl.appendChild(item);
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        const currentUrl = window.location.href.split('?')[0] + '?mobile=1';
        document.getElementById('share-url').innerText = currentUrl;
        new QRCode(document.getElementById("qrcode"), {
            text: currentUrl,
            width: 200,
            height: 200
        });

        document.getElementById('qr-btn').addEventListener('click', () => {
            document.getElementById('qr-modal').classList.remove('hidden');
        });
        document.getElementById('close-qr').addEventListener('click', () => {
            document.getElementById('qr-modal').classList.add('hidden');
        });

        document.getElementById('list-btn').addEventListener('click', () => {
            document.getElementById('list-modal').classList.remove('hidden');
        });
        document.getElementById('close-list').addEventListener('click', () => {
            document.getElementById('list-modal').classList.add('hidden');
        });

        document.getElementById('backup-btn').addEventListener('click', async () => {
            const gasUrl = document.getElementById('gas-url').value.trim();
            if (!gasUrl) {
                alert('請先填入您的 Google Apps Script 部署網址 (Web App URL)');
                return;
            }

            const statusEl = document.getElementById('backup-status');
            statusEl.innerText = "⏳ 正在打包並上傳至 Google Drive...";

            let filtered = allMessages.filter(m => (m.module || 'trash') === currentModule);

            try {
                await fetch(gasUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        module: currentModule,
                        messages: filtered
                    })
                });

                statusEl.innerText = "✅ 備份請求已送出！請至您的 Google Drive 資料夾確認檔案。";
            } catch (err) {
                console.error(err);
                statusEl.innerText = "❌ 備份失敗，請檢查 GAS 網址與部署權限。";
            }
        });
    </script>
</body>
</html>
