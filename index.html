<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式馬卡龍即時文字牆</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Matter.js 物理引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Google Fonts: 繁體思源黑體 (Noto Sans TC) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #fdfaf6;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        /* 馬卡龍柔和色彩系列 */
        .macaron-pink   { background: linear-gradient(135deg, #ffd1dc 0%, #ffc0cb 100%); }
        .macaron-blue   { background: linear-gradient(135deg, #cbebf6 0%, #b5ead7 100%); }
        .macaron-yellow { background: linear-gradient(135deg, #fff2cc 0%, #ffe599 100%); }
        .macaron-purple { background: linear-gradient(135deg, #e8d7ff 0%, #dcd0ff 100%); }
        .macaron-mint   { background: linear-gradient(135deg, #d2f8d2 0%, #bbf2c4 100%); }
        .macaron-orange { background: linear-gradient(135deg, #ffe0cc 0%, #ffd0b3 100%); }

        /* 大容器微幅懸浮動畫 */
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.01); }
        }
        .container-float {
            animation: gentleFloat 4s ease-in-out infinite;
        }
        .container-shadow {
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.12));
        }

        /* 隱藏捲軸但可捲動 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between relative overflow-hidden bg-[#fdfaf6]">

    <!-- 頂端主工具列 -->
    <header class="w-full px-6 py-4 flex justify-between items-center z-30 bg-white/90 backdrop-blur-md border-b border-orange-100/60 shadow-sm">
        <div class="flex items-center gap-3">
            <div id="header-icon" class="text-3xl md:text-4xl">🗑️</div>
            <div>
                <h1 id="main-title" class="text-2xl md:text-3xl font-extrabold text-gray-800 tracking-tight flex items-center gap-2">
                    丟掉煩惱、留下真心話
                </h1>
                <p id="main-subtitle" class="text-xs md:text-sm text-gray-500 mt-0.5">請用手機掃描 QR Code 把想法投遞進來！</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <!-- 模組切換選單 -->
            <div class="relative">
                <select id="module-select" class="px-4 py-2.5 bg-white border-2 border-pink-200 text-gray-700 font-bold text-sm md:text-base rounded-full shadow-sm hover:border-pink-300 focus:outline-none cursor-pointer pr-9 appearance-none transition">
                    <option value="trash">🗑️ 垃圾桶 (丟紙球)</option>
                    <option value="well">⛲ 許願池 (投金幣)</option>
                    <option value="vote">🗳️ 投票箱 (投選票)</option>
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 text-xs">
                    ▼
                </div>
            </div>

            <!-- 開啟新回合 (清空) 按鈕 -->
            <button id="reset-btn" title="開啟新回合" class="px-3.5 py-2.5 bg-gray-100 hover:bg-rose-100 text-gray-600 hover:text-rose-600 font-bold text-sm md:text-base rounded-full border border-gray-200 hover:border-rose-300 shadow-sm transition transform active:scale-95 cursor-pointer flex items-center gap-1.5">
                <span>🧹</span> 新回合
            </button>

            <!-- QR Code 彈窗按鈕 -->
            <button id="qr-btn" class="px-4 py-2.5 bg-pink-400 hover:bg-pink-500 text-white font-bold text-sm md:text-base rounded-full shadow-md transition transform active:scale-95 cursor-pointer flex items-center gap-1.5">
                <span>📱</span> QR Code
            </button>

            <!-- 展開字塊磚按鈕 -->
            <button id="toggle-tiles-btn" class="px-5 py-2.5 bg-amber-300 hover:bg-amber-400 text-gray-800 font-extrabold text-sm md:text-base rounded-full shadow-md transition transform active:scale-95 cursor-pointer flex items-center gap-1.5">
                <span id="list-btn-icon">📜</span> 展開字塊磚 (<span id="count">0</span>)
            </button>
        </div>
    </header>

    <!-- 中央大容器向量區 (點擊即可開箱展開字塊磚) -->
    <div id="container-visual-wrapper" class="absolute left-1/2 bottom-3 transform -translate-x-1/2 z-10 flex flex-col items-center cursor-pointer transition-all duration-500">
        <!-- 點擊提示標籤 -->
        <div class="mb-2 bg-white/95 backdrop-blur-md px-5 py-1.5 rounded-full shadow-md border border-pink-200/80 text-pink-700 font-bold text-xs md:text-sm flex items-center gap-2 hover:scale-105 transition">
            <span id="tag-icon">👆</span>
            <span id="tag-label">點擊大容器，倒出真心話字塊磚！</span>
        </div>

        <!-- 大容器插圖主體 (高度約佔畫面 50%，開口朝上) -->
        <div id="container-svg-host" class="container-float container-shadow flex justify-center items-end" style="height: 50vh; max-height: 520px; width: min(88vw, 680px);">
            <!-- SVG 插圖由 JS 動態注入 -->
        </div>
    </div>

    <!-- Matter.js 物理圖層 (全螢幕穿透，紙球/金幣/選票沿著隱形漏斗滑入開口) -->
    <div id="canvas-container" class="absolute inset-0 z-20 pointer-events-none"></div>

    <!-- 全螢幕字塊磚 (揭曉便利貼模式) 覆蓋層 -->
    <div id="tiles-overlay" class="hidden fixed inset-0 z-40 bg-white/95 backdrop-blur-xl flex flex-col justify-between p-6 transition-all duration-300">
        <!-- 字塊磚頂端操作條 -->
        <div class="w-full flex justify-between items-center border-b border-gray-200/80 pb-4">
            <div class="flex items-center gap-3">
                <span id="tiles-header-icon" class="text-3xl">🗑️</span>
                <div>
                    <h2 id="tiles-header-title" class="text-2xl md:text-3xl font-extrabold text-gray-800">真心話字塊磚牆</h2>
                    <p class="text-xs md:text-sm text-gray-500">目前共累積 <span id="tiles-total-count" class="font-bold text-pink-600">0</span> 則內容</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- 雲端備份按鈕 -->
                <button id="backup-btn" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm md:text-base rounded-full shadow-md transition transform active:scale-95 cursor-pointer flex items-center gap-1.5">
                    <span>☁️</span> 備份至 Google Drive (TXT)
                </button>
                <!-- 收起字塊磚按鈕 -->
                <button id="close-tiles-btn" class="px-5 py-2.5 bg-pink-400 hover:bg-pink-500 text-white font-extrabold text-sm md:text-base rounded-full shadow-md transition transform active:scale-95 cursor-pointer flex items-center gap-1.5">
                    <span>📥</span> 收回箱內 / 繼續投遞
                </button>
            </div>
        </div>

        <!-- 字塊磚展示核心區 (大字體、美觀馬卡龍色塊) -->
        <div class="flex-1 w-full max-w-7xl mx-auto flex items-center justify-center my-4 overflow-hidden relative">
            <div id="tiles-grid" class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-2 max-h-full overflow-y-auto no-scrollbar">
                <!-- 動態注入大字磚 -->
            </div>
            <!-- 空清單提示 -->
            <div id="tiles-empty" class="hidden flex flex-col items-center justify-center text-center p-8">
                <span class="text-6xl mb-3">📭</span>
                <p class="text-2xl font-bold text-gray-400">目前還沒有任何投遞紀錄喔！</p>
                <p class="text-sm text-gray-400 mt-1">請用手機掃描 QR Code 投入第一則心聲～</p>
            </div>
        </div>

        <!-- 字塊磚底部換頁控制列 -->
        <div class="w-full flex justify-between items-center border-t border-gray-200/80 pt-3 px-4">
            <div class="text-xs md:text-sm text-gray-500">
                💡 可使用鍵盤左右方向鍵 (◀ / ▶) 快速切換頁面
            </div>
            <div class="flex items-center gap-4">
                <button id="prev-page-btn" class="px-5 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-sm md:text-base rounded-full transition disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer flex items-center gap-1">
                    ◀ 上一頁
                </button>
                <span id="page-indicator" class="text-base md:text-lg font-black text-gray-700 tracking-wider">
                    第 1 / 1 頁
                </span>
                <button id="next-page-btn" class="px-5 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-sm md:text-base rounded-full transition disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer flex items-center gap-1">
                    下一頁 ▶
                </button>
            </div>
            <div id="backup-status" class="text-xs md:text-sm font-semibold text-gray-500"></div>
        </div>
    </div>

    <!-- 手機端輸入介面 (網址帶有 ?mobile=1 時全螢幕覆蓋) -->
    <div id="mobile-view" class="hidden fixed inset-0 bg-[#fff8f5] z-50 flex flex-col justify-center items-center p-5 overflow-y-auto">
        <div class="max-w-md w-full bg-white p-7 rounded-3xl shadow-2xl border-4 border-pink-200 text-center relative">
            <div id="mobile-icon" class="text-5xl mb-2">📜</div>
            <h2 id="mobile-heading" class="text-2xl md:text-3xl font-black text-gray-800 mb-1">寫下你的真心話</h2>
            <p id="mobile-desc" class="text-gray-500 mb-4 text-sm">送出後，它會揉成紙球直接拋進大螢幕！</p>
            
            <textarea id="user-input" rows="4" class="w-full p-4 border-2 border-pink-200 rounded-2xl text-lg focus:outline-none focus:border-pink-400 resize-none mb-4" placeholder="請在此輸入想說的話..."></textarea>
            
            <button id="submit-btn" class="w-full py-4 bg-pink-400 hover:bg-pink-500 active:bg-pink-600 text-white font-black text-xl rounded-2xl shadow-lg transition transform active:scale-95 cursor-pointer">
                🚀 揉成紙球丟出去！
            </button>

            <div id="mobile-success" class="hidden mt-4 text-emerald-700 font-bold text-base p-3 bg-emerald-50 rounded-xl border border-emerald-200 animate-pulse">
                🎉 投遞成功！請抬頭看大螢幕～
            </div>
            <div id="mobile-error" class="hidden mt-4 text-rose-600 font-bold text-sm p-2 bg-rose-50 rounded-xl border border-rose-200"></div>
        </div>
    </div>

    <!-- QR Code 彈窗 -->
    <div id="qr-modal" class="hidden fixed inset-0 bg-black/45 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white p-6 rounded-3xl shadow-2xl text-center max-w-sm w-full relative">
            <h3 class="text-lg font-extrabold text-gray-800 mb-1">手機掃描立即投遞</h3>
            <p class="text-xs text-gray-500 mb-3">手機介面已自動與目前模組連動！</p>
            <div id="qrcode" class="flex justify-center my-3 p-3 bg-gray-50 rounded-2xl border border-gray-100"></div>
            <p class="text-gray-400 text-xs mb-4 break-all font-mono" id="share-url"></p>
            <button id="close-qr" class="w-full py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-sm rounded-xl cursor-pointer">
                關閉視窗
            </button>
        </div>
    </div>

    <!-- 新回合確認重設彈窗 (替代原生 confirm) -->
    <div id="reset-modal" class="hidden fixed inset-0 bg-black/45 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white p-6 rounded-3xl shadow-2xl text-center max-w-sm w-full">
            <div class="text-4xl mb-2">🧹</div>
            <h3 class="text-lg font-black text-gray-800 mb-2">確定要開啟新回合嗎？</h3>
            <p class="text-xs text-gray-500 mb-5 leading-relaxed">這將清空當前模組在畫面上的物理物件與計數，讓下一場活動重新開始！</p>
            <div class="flex gap-3">
                <button id="cancel-reset-btn" class="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-sm rounded-xl cursor-pointer">
                    取消
                </button>
                <button id="confirm-reset-btn" class="flex-1 py-2.5 bg-rose-500 hover:bg-rose-600 text-white font-bold text-sm rounded-xl shadow cursor-pointer">
                    確定清空
                </button>
            </div>
        </div>
    </div>

    <script type="module">

        import { getFirestore, collection, addDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Google Apps Script 部署網址 (用於備份至 Google Drive)

        let allMessages = [];
        let activeBodies = [];
        let currentModule = 'trash'; // 'trash', 'well', 'vote'
        let currentPage = 1;
        const ITEMS_PER_PAGE = 6; // 大字磚每頁 6 張 (2x3 或 3x2)，兼顧閱讀性與氣勢

        const moduleConfigs = {
            trash: {
                title: "丟掉煩惱、留下真心話",

                colorList: ['#ffb7b2', '#b5ead7', '#ffdac1', '#e2f0cb', '#c7ceea', '#ffd0b3'],

                renderSvg: () => `

                                <stop offset="0%" stop-color="#e2e8f0"/>

                        </defs>
                        <path d="M 85 90 L 125 385 Q 130 400 160 400 L 340 400 Q 370 400 375 385 L 415 90 Z" fill="url(#trashBodyGrad)" stroke="#475569" stroke-width="7"/>

            },

            },
            vote: {
                title: "即時投票箱：投下神聖的一票",

                btnText: "選票字塊磚",
                icon: "🗳️",
                tagLabel: "點擊大投票箱，開箱展示神聖選票！",
                mobileIcon: "📝",
                mobileHeading: "輸入您的票選意見",
                mobileDesc: "送出後，摺疊選票會投入大螢幕投票箱！",

                            </linearGradient>
                            <linearGradient id="boxTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#0f766e"/>

                                <stop offset="100%" stop-color="#0d9488"/>
                            </linearGradient>
                        </defs>
                        <path d="M 60 120 L 80 380 Q 85 395 120 395 L 380 395 Q 415 395 420 380 L 440 120 Z" fill="url(#boxFrontGrad)" stroke="#0f766e" stroke-width="8"/>

                        <text x="250" y="252" font-size="26" text-anchor="middle" fill="#0f766e" font-weight="900">🗳️ 投票箱</text>
                        <text x="250" y="280" font-size="13" text-anchor="middle" fill="#115e59" font-weight="bold" letter-spacing="2">BALLOT BOX</text>
                        <polygon points="30,120 90,70 410,70 470,120" fill="url(#boxTopGrad)" stroke="#0f766e" stroke-width="6"/>
                        <ellipse cx="250" cy="95" rx="110" ry="12" fill="#042f2e" stroke="#ccfbf1" stroke-width="3"/>
                    </svg>

        };

        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Body = Matter.Body,
              Composite = Matter.Composite;

        const engine = Engine.create();
        const world = engine.world;
        engine.world.gravity.y = 1.05;

        const canvasHost = document.getElementById('canvas-container');
        const render = Render.create({
            element: canvasHost,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: 'transparent'
            }
        });
        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        let containerFloor, containerLeftWall, containerRightWall;
        let leftFunnelSlope, rightFunnelSlope;

        // 更新物理邊界與傾斜漏斗 (Funnel)，確保物件 100% 導流進開口
        function updatePhysicsBoundaries() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            if (containerFloor) Composite.remove(world, containerFloor);
            if (containerLeftWall) Composite.remove(world, containerLeftWall);
            if (containerRightWall) Composite.remove(world, containerRightWall);
            if (leftFunnelSlope) Composite.remove(world, leftFunnelSlope);
            if (rightFunnelSlope) Composite.remove(world, rightFunnelSlope);

            const containerH = Math.min(h * 0.50, 520);
            const containerW = Math.min(w * 0.88, 680);
            const centerX = w / 2;
            const bottomY = h - 20;

            // 容器底板
            containerFloor = Bodies.rectangle(centerX, bottomY, containerW * 0.70, 40, {
                isStatic: true,
                render: { visible: false }
            });

            // 容器左右側壁
            const wallH = containerH * 0.78;
            const wallY = bottomY - wallH / 2;
            const halfW = (containerW * 0.70) / 2;

            containerLeftWall = Bodies.rectangle(centerX - halfW, wallY, 30, wallH, {
                isStatic: true,
                render: { visible: false }
            });
            containerRightWall = Bodies.rectangle(centerX + halfW, wallY, 30, wallH, {
                isStatic: true,
                render: { visible: false }
            });

            // 開口兩側傾斜漏斗 (Funnel 斜坡，把上方隨機掉落的球滑進開口)
            const funnelW = Math.max(w * 0.28, 220);
            const funnelH = 20;
            const funnelY = bottomY - wallH - 30;

            leftFunnelSlope = Bodies.rectangle(centerX - halfW - funnelW * 0.45, funnelY, funnelW, funnelH, {
                isStatic: true,
                angle: 0.55, // 朝內傾斜
                render: { visible: false }
            });

            rightFunnelSlope = Bodies.rectangle(centerX + halfW + funnelW * 0.45, funnelY, funnelW, funnelH, {
                isStatic: true,
                angle: -0.55, // 朝內傾斜
                render: { visible: false }
            });

            Composite.add(world, [containerFloor, containerLeftWall, containerRightWall, leftFunnelSlope, rightFunnelSlope]);
        }

        updatePhysicsBoundaries();

        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
            updatePhysicsBoundaries();
        });

        // 產生物理物件 (紙球 / 金幣 / 選票)
        function spawnObject(moduleType) {
            const centerX = window.innerWidth / 2;
            // 隨機投擲範圍限制在中央上方，配合漏斗確保 100% 入池
            const spawnSpread = Math.min(window.innerWidth * 0.35, 260);
            const startX = centerX + (Math.random() * spawnSpread - spawnSpread / 2);
            const startY = -40;

            const cfg = moduleConfigs[moduleType] || moduleConfigs.trash;
            const color = cfg.colorList[Math.floor(Math.random() * cfg.colorList.length)];
            let body;

            if (moduleType === 'well') {
                body = Bodies.circle(startX, startY, 26, {
                    restitution: 0.65,
                    friction: 0.08,
                    density: 0.002,
                    render: { fillStyle: color, strokeStyle: '#ffffff', lineWidth: 3.5 }
                });
            } else if (moduleType === 'vote') {
                body = Bodies.rectangle(startX, startY, 65, 42, {
                    restitution: 0.25,
                    friction: 0.28,
                    density: 0.0015,
                    angle: (Math.random() - 0.5) * 1.2,
                    render: { fillStyle: color, strokeStyle: '#ffffff', lineWidth: 2.5 }
                });
            } else {
                body = Bodies.circle(startX, startY, 30, {
                    restitution: 0.45,
                    friction: 0.2,
                    density: 0.0018,
                    render: { fillStyle: color, strokeStyle: '#ffffff', lineWidth: 3.5 }
                });
            }

            activeBodies.push(body);
            Composite.add(world, body);

            // 若畫面累積超過 120 顆，移除最早的一顆維持流暢性能
            if (activeBodies.length > 120) {
                const oldest = activeBodies.shift();
                Composite.remove(world, oldest);
            }
        }

        // 更新大螢幕與 QR Code 狀態
        function updateModuleUI(mod) {
            currentModule = mod;
            const cfg = moduleConfigs[mod];

            // 標題列
            document.getElementById('header-icon').innerText = cfg.icon;
            document.getElementById('main-title').innerText = cfg.title;
            document.getElementById('main-subtitle').innerText = cfg.subtitle;
            document.getElementById('tag-label').innerText = cfg.tagLabel;
            document.getElementById('list-btn-icon').innerText = cfg.icon;

            // 中央大插圖更新
            document.getElementById('container-svg-host').innerHTML = cfg.renderSvg();

            // 字塊磚模式標題更新
            document.getElementById('tiles-header-icon').innerText = cfg.icon;
            document.getElementById('tiles-header-title').innerText = `${cfg.icon} ${cfg.btnText}牆`;

            // 動態更新 QR Code (攜帶當前模式 mode 參數，手機端掃描自動連動)
            updateQrCode();

            // 重新整理目前模組的留言清單與計數
            const filtered = getFilteredMessages();
            document.getElementById('count').innerText = filtered.length;
            document.getElementById('tiles-total-count').innerText = filtered.length;
            currentPage = 1;
            renderTiles();
        }

        function getFilteredMessages() {
            return allMessages.filter(m => (m.module || 'trash') === currentModule);
        }

        // 渲染大字塊磚 (便利貼牆)
        function renderTiles() {
            const gridEl = document.getElementById('tiles-grid');
            const emptyEl = document.getElementById('tiles-empty');
            const filtered = getFilteredMessages();
            const totalCount = filtered.length;

            document.getElementById('tiles-total-count').innerText = totalCount;

            if (totalCount === 0) {
                gridEl.innerHTML = '';
                emptyEl.classList.remove('hidden');
                document.getElementById('page-indicator').innerText = '第 1 / 1 頁';
                document.getElementById('prev-page-btn').disabled = true;
                document.getElementById('next-page-btn').disabled = true;
                return;
            }

            emptyEl.classList.add('hidden');
            const totalPages = Math.ceil(totalCount / ITEMS_PER_PAGE);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const pageItems = filtered.slice(startIndex, startIndex + ITEMS_PER_PAGE);

            gridEl.innerHTML = '';
            const colorClasses = ['macaron-pink', 'macaron-blue', 'macaron-yellow', 'macaron-purple', 'macaron-mint', 'macaron-orange'];

            pageItems.forEach((msg, idx) => {
                const globalIndex = startIndex + idx;
                const colorClass = colorClasses[globalIndex % colorClasses.length];
                const dateStr = new Date(msg.timestamp).toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });

                const card = document.createElement('div');
                // 大字體、卡片陰影與立體馬卡龍質感
                card.className = `${colorClass} p-7 rounded-3xl shadow-lg border-2 border-white/80 flex flex-col justify-between transform transition duration-300 hover:scale-[1.02] min-h-[220px]`;
                card.innerHTML = `
                    <div class="text-2xl md:text-3xl font-extrabold text-gray-800 leading-snug break-words tracking-tight">
                        ${escapeHtml(msg.text)}
                    </div>
                    <div class="flex justify-between items-center mt-6 pt-3 border-t border-black/10 text-xs md:text-sm font-bold text-gray-600">
                        <span>#${totalCount - globalIndex} 樓</span>
                        <span class="font-mono bg-white/50 px-2.5 py-1 rounded-full">${dateStr}</span>
                    </div>
                `;
                gridEl.appendChild(card);
            });

            // 換頁控制按鈕狀態
            document.getElementById('page-indicator').innerText = `第 ${currentPage} / ${totalPages} 頁`;
            document.getElementById('prev-page-btn').disabled = (currentPage <= 1);
            document.getElementById('next-page-btn').disabled = (currentPage >= totalPages);
        }

        function escapeHtml(text) {
            return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // 翻頁事件
        document.getElementById('prev-page-btn').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderTiles();
            }
        });
        document.getElementById('next-page-btn').addEventListener('click', () => {
            const totalPages = Math.ceil(getFilteredMessages().length / ITEMS_PER_PAGE);
            if (currentPage < totalPages) {
                currentPage++;
                renderTiles();
            }
        });

        // 鍵盤左右方向鍵翻頁
        window.addEventListener('keydown', (e) => {
            const overlay = document.getElementById('tiles-overlay');
            if (overlay.classList.contains('hidden')) return;

            if (e.key === 'ArrowLeft') {
                if (currentPage > 1) {
                    currentPage--;
                    renderTiles();
                }
            } else if (e.key === 'ArrowRight') {
                const totalPages = Math.ceil(getFilteredMessages().length / ITEMS_PER_PAGE);
                if (currentPage < totalPages) {
                    currentPage++;
                    renderTiles();
                }
            } else if (e.key === 'Escape') {
                closeTilesOverlay();
            }
        });

        // 展開與關閉字塊磚介面
        function openTilesOverlay() {
            currentPage = 1;
            renderTiles();
            document.getElementById('tiles-overlay').classList.remove('hidden');
        }

        function closeTilesOverlay() {
            document.getElementById('tiles-overlay').classList.add('hidden');
        }

        // 點擊中央大容器或右上角按鈕均可展開字塊磚
        document.getElementById('container-visual-wrapper').addEventListener('click', openTilesOverlay);
        document.getElementById('toggle-tiles-btn').addEventListener('click', openTilesOverlay);
        document.getElementById('close-tiles-btn').addEventListener('click', closeTilesOverlay);

        // 模組切換選單監聽
        document.getElementById('module-select').addEventListener('change', (e) => {
            updateModuleUI(e.target.value);
        });

        // QR Code 生成 (攜帶 ?mobile=1&mode=...)
        let qrcodeInstance = null;
        function updateQrCode() {
            const baseUrl = window.location.href.split('?')[0];
            const targetUrl = `${baseUrl}?mobile=1&mode=${currentModule}`;
            document.getElementById('share-url').innerText = targetUrl;

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            qrcodeInstance = new QRCode(qrContainer, {
                text: targetUrl,
                width: 190,
                height: 190,
                colorDark: "#1f2937",
                colorLight: "#ffffff"
            });
        }

        document.getElementById('qr-btn').addEventListener('click', () => {
            document.getElementById('qr-modal').classList.remove('hidden');
        });
        document.getElementById('close-qr').addEventListener('click', () => {
            document.getElementById('qr-modal').classList.add('hidden');
        });

        // 新回合 (清空畫面物體與當前模組狀態)
        document.getElementById('reset-btn').addEventListener('click', () => {
            document.getElementById('reset-modal').classList.remove('hidden');
        });
        document.getElementById('cancel-reset-btn').addEventListener('click', () => {
            document.getElementById('reset-modal').classList.add('hidden');
        });
        document.getElementById('confirm-reset-btn').addEventListener('click', () => {
            // 清理 Matter.js 畫面上的物理物件
            activeBodies.forEach(b => Composite.remove(world, b));
            activeBodies = [];

            // 本機暫存過濾掉當前模組訊息 (開啟新一輪活動)
            allMessages = allMessages.filter(m => (m.module || 'trash') !== currentModule);
            document.getElementById('count').innerText = '0';
            document.getElementById('tiles-total-count').innerText = '0';
            renderTiles();

            document.getElementById('reset-modal').classList.add('hidden');
        });

        // Firestore 即時同步監聽
        function initFirestoreListener() {
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'messages'));
            onSnapshot(q, (snapshot) => {
                let newMessages = [];
                snapshot.forEach((doc) => {
                    newMessages.push({ id: doc.id, ...doc.data() });
                });
                newMessages.sort((a, b) => b.timestamp - a.timestamp);

                // 若有新訊息進來，大螢幕立即掉落物體
                if (newMessages.length > allMessages.length && allMessages.length > 0) {
                    const diff = newMessages.length - allMessages.length;
                    for (let i = 0; i < Math.min(diff, 6); i++) {
                        const item = newMessages[i];
                        setTimeout(() => {
                            if ((item.module || 'trash') === currentModule) {
                                spawnObject(currentModule);
                            }
                        }, i * 220);
                    }
                }

                allMessages = newMessages;
                const filtered = getFilteredMessages();
                document.getElementById('count').innerText = filtered.length;
                renderTiles();
            }, (error) => {
                console.error("Firestore 連線失敗:", error);
            });
        }

        initFirestoreListener();

        // 判斷是否為手機端輸入畫面 (?mobile=1)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mobile') === '1') {
            const mobileView = document.getElementById('mobile-view');
            mobileView.classList.remove('hidden');

            // 手機端依照 mode 參數自動初始化介面
            const targetMode = urlParams.get('mode') || 'trash';
            const mCfg = moduleConfigs[targetMode] || moduleConfigs.trash;

            document.getElementById('mobile-icon').innerText = mCfg.mobileIcon;
            document.getElementById('mobile-heading').innerText = mCfg.mobileHeading;
            document.getElementById('mobile-desc').innerText = mCfg.mobileDesc;
            document.getElementById('submit-btn').innerText = mCfg.submitText;

            // 手機送出留言
            document.getElementById('submit-btn').addEventListener('click', async () => {
                const inputEl = document.getElementById('user-input');
                const text = inputEl.value.trim();
                const successMsg = document.getElementById('mobile-success');
                const errorMsg = document.getElementById('mobile-error');

                successMsg.classList.add('hidden');
                errorMsg.classList.add('hidden');

                if (!text) {
                    errorMsg.innerText = "請輸入文字後再送出喔！";
                    errorMsg.classList.remove('hidden');
                    return;
                }

                const btn = document.getElementById('submit-btn');
                try {
                    btn.disabled = true;
                    btn.innerText = "🚀 投遞中...";

                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
                        text: text,
                        module: targetMode,
                        timestamp: Date.now()
                    });

                    inputEl.value = '';
                    successMsg.classList.remove('hidden');
                    setTimeout(() => successMsg.classList.add('hidden'), 4000);
                } catch (err) {
                    console.error("送出失敗:", err);
                    errorMsg.innerText = "傳送失敗，請確認網路連線";
                    errorMsg.classList.remove('hidden');
                } finally {
                    btn.disabled = false;
                    btn.innerText = mCfg.submitText;
                }
            });
        }

        // 雲端備份至 Google Drive (格式：TXT)
        document.getElementById('backup-btn').addEventListener('click', async () => {
            const statusEl = document.getElementById('backup-status');
            const filtered = getFilteredMessages();

            if (filtered.length === 0) {
                statusEl.innerText = "⚠️ 目前沒有任何紀錄可供備份！";
                setTimeout(() => statusEl.innerText = '', 3000);
                return;
            }

            statusEl.innerText = "⏳ 正在備份 TXT 至 Google Drive...";

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        module: currentModule,
                        messages: filtered
                    })
                });

                statusEl.innerText = "✅ 備份請求已送出！請至 Google Drive 資料夾確認 TXT 檔案。";
                setTimeout(() => statusEl.innerText = '', 6000);
            } catch (err) {
                console.error("備份失敗:", err);
                statusEl.innerText = "❌ 備份請求失敗，請檢查 GAS 部署。";
            }
        });

        // 預設初始化為垃圾桶模組
        updateModuleUI('trash');
    </script>
</body>
</html>
